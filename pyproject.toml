[project]
name = "routecluster-benchmark"
version = "0.1.0"
description = "Benchmarking retrosynthetic route clustering (SBP, TED, AB, Tree-LSTM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "seaborn",
  "tqdm",
  "pyyaml",
  "jupyter",
  "ipykernel",
  "rdkit",
  "chython-synplan",
  "synplanner==1.5.0",
  "matplotlib-venn==1.1.2",
]

[project.urls]
Homepage = "https://github.com/Laboratoire-de-Chemoinformatique/routecluster-benchmark"
Issues = "https://github.com/Laboratoire-de-Chemoinformatique/routecluster-benchmark/issues"

[project.optional-dependencies]
ab = ["aizynthfinder==4.4.1"]
ted = ["aizynthfinder==4.3.2"]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cgr_clustering"]

[tool.uv]
conflicts = [
  [
    { extra = "ab" },
    { extra = "ted" },
  ]
]
